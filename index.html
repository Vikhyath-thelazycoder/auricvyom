<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURICVISTA — Discover. Explore. Plan. Travel. | Luxury Bespoke Travel</title>
    
    <!-- Meta & SEO Best Practices -->
    <meta name="description" content="AuricVista is India's premier luxury travel platform. Discover bespoke Karnataka coffee estates, Hampi heritage, Kabini big cat safaris, flights, curated tour packages, and AI travel concierge." />
    <meta name="keywords" content="AuricVista, Karnataka tourism, Coorg coffee estates, Hampi heritage, Kabini wildlife safari, Gokarna beaches, luxury travel India, bespoke itinerary planner, AI travel assistant" />
    <meta name="author" content="AuricVista Technologies" />

    <!-- Open Graph / Social -->
    <meta property="og:site_name" content="AURICVISTA" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AURICVISTA — Discover. Explore. Plan. Travel." />
    <meta property="og:description" content="Discover breathtaking landscapes, ancient heritage, hidden escapes and unforgettable experiences across Karnataka and India." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1586861635167-e5223aadc9fe?auto=format&fit=crop&w=1200&q=80" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Core Stylesheet -->
    <link rel="stylesheet" href="./styles/main.css" />

    <style>
      /* Mobile Drawer Style */
      .mobile-drawer {
        position: fixed;
        top: 0;
        right: -320px;
        width: 300px;
        height: 100vh;
        background: var(--bg-surface);
        border-left: 1px solid var(--border-gold);
        z-index: 3000;
        transition: right var(--transition-smooth);
        box-shadow: var(--shadow-lg);
      }
      .mobile-drawer.active {
        right: 0;
      }
      /* Print Styling */
      @media print {
        .auric-navbar, .auric-footer, .hero-cta-group, .floating-service-dock, .modal-close-btn, #add-trip-day-btn, #export-trip-voucher-btn, .ai-input-bar-wrap {
          display: none !important;
        }
        body, html {
          background: #ffffff !important;
          color: #000000 !important;
        }
        .modal-window-container, .destination-card, [style*="background: var(--bg-card)"] {
          background: #ffffff !important;
          color: #000000 !important;
          border: 1px solid #cccccc !important;
          box-shadow: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- App Root Mount -->
    <div id="app-root"></div>

    <!-- Application Script Entry Point -->
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
